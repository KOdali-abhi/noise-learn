[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "iladok"
version = "0.1.0"
description = "Universal Latent Space Navigation: Bring your own LLM, we add the steering."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch",
    "transformers",
    "peft",
    "openai",
    "tqdm",
    "numpy"
]

[project.urls]
"Homepage" = "https://github.com/yourusername/iladok"